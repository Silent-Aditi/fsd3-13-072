<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - EduPulse Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            accent: '#06b6d4',
                            dark: '#0f172a'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f3f4f6; }
        .glass-card { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(20px); }
        .text-gradient { background: linear-gradient(135deg, #ffffff 0%, #34d399 50%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#0b0f17] text-gray-100 min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 text-2xl font-black">
                <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-accent flex items-center justify-center text-white">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </span>
                <span class="text-gradient">EduPulse</span>
            </a>
            <div class="hidden md:flex items-center gap-4 text-sm font-medium">
                <a href="index.html" class="px-3 py-2 rounded-xl text-gray-300">Courses</a>
                <a href="pricing.html" class="px-3 py-2 rounded-xl text-gray-300">Pricing</a>
                <a href="register.html" class="px-3 py-2 rounded-xl text-brand-accent font-bold">Register</a>
                <a href="login.html" class="px-3 py-2 rounded-xl text-gray-300">Login</a>
                <a href="feedback.html" class="px-3 py-2 rounded-xl text-gray-300">Feedback</a>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-16 flex-grow max-w-7xl mx-auto px-4 w-full">
        
            <div class="glass-card rounded-3xl p-8 sm:p-12 border border-white/10 shadow-2xl">
                <div class="text-center mb-8">
                    <span class="text-xs font-bold uppercase tracking-widest text-brand-accent">Begin Your Journey</span>
                    <h2 class="text-3xl font-black text-white mt-2">Student Registration</h2>
                    <p class="text-gray-400 text-xs sm:text-sm mt-1">Sign up for live classes or book a free trial trial session.</p>
                </div>

                <form onsubmit="handleFormSubmit(event, 'Registration Successful! We have sent a confirmation email with class portal credentials.')" class="space-y-5">
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-2">First Name</label>
                            <input type="text" required="" placeholder="Alex" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-2">Last Name</label>
                            <input type="text" required="" placeholder="Rivera" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-2">Email Address</label>
                        <input type="email" required="" placeholder="alex.rivera@example.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-2">Target Subject</label>
                            <select required="" class="w-full bg-[#121826] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                                <option value="">Select Subject...</option>
                                <option value="AP Calculus BC">AP Calculus BC</option>
                                <option value="Quantum Physics">Quantum &amp; Newtonian Physics</option>
                                <option value="Organic Chemistry">Organic Chemistry</option>
                                <option value="Data Structures">Data Structures &amp; CS</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-2">Academic Level</label>
                            <select required="" class="w-full bg-[#121826] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                                <option value="High School">High School (Grades 9-10)</option>
                                <option value="AP/IB">AP / IB Prep (Grades 11-12)</option>
                                <option value="Undergraduate">Undergraduate / College</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-2">Create Password</label>
                        <input type="password" required="" placeholder="••••••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
                    </div>

                    <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-brand-600 to-brand-accent hover:opacity-90 transition-all shadow-lg shadow-brand-500/25">
                        Submit Student Registration
                    </button>
                    
                    <p class="text-center text-xs text-gray-400 mt-4">
                        Already registered? <a href="javascript:void(0)" onclick="navigateTo('login')" class="text-brand-accent hover:underline">Log in here</a>
                    </p>
                </form>
            </div>
        
    </main>

    <!-- Footer -->
    <footer class="bg-[#070a10] border-t border-white/10 text-gray-400 text-sm py-8 text-center">
        <p>&copy; 2026 EduPulse Academy. All rights reserved.</p>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
